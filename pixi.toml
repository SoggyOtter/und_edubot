[workspace]
authors = ["SoggyOtter <alexandere42@outlook.com>"]
channels = ["robostack-humble", "conda-forge"]
name = "und_edubot"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
build = "colcon build --symlink-install"
format = { cmd = "ruff format src", default-environment = "test" }
typecheck = { cmd = "pyrefly check", default-environment = "test" }
zenohd = { cmd = "ros2 run rmw_zenoh_cpp rmw_zenohd", default-environment = "zenoh" }
clean = "rm -rf build install log"
pibot = "ros2 run PiBot motor_control"
teleop = "ros2 run teleop_twist_keyboard teleop_twist_keyboard"


[dependencies]
ros-humble-foxglove-bridge = ">=0.8.5,<0.9"
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<=58.2.0"
ros-humble-rmw-zenoh-cpp = ">=0.1.2,<0.2"
cxx-compiler = ">=1.11.0,<2"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
gpiozero = ">=2.0.1,<3"

[feature.zenoh.activation]
env = {

    RMW_IMPLEMENTATION="rmw_zenoh_cpp",
    ZENOH_ROUTER_CONFIG_URI="$PIXI_PROJECT_ROOT/router.json5"}

[feature.test.dependencies]
ruff = "*"
pyrefly = ">=1.0.0,<2"

[environments]
zenoh = ["zenoh"]
test = ["test"]

[activation]
scripts = ["./activate.sh"]

[system-requirements]
libc = "2.34"

[target.linux-aarch64.dependencies]
lgpio = ">=0.2.2.0,<0.3"
smbus2 = ">=0.4.3,<0.5"
